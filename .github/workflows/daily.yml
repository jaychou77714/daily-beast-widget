name: 爆肝獸舊版手動備份（自動排程已停用）
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '指定日期 YYYY-MM-DD（留空為台灣今天）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-beast-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate legacy Beast content on manual request only
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            node scripts/generate.mjs "--date=$TARGET_DATE"
            node scripts/generate-game.mjs "--date=$TARGET_DATE"
          else
            node scripts/generate.mjs
            node scripts/generate-game.mjs
          fi
      - name: Commit legacy data only if manually requested
        run: |
          git add data/today.json game/today.json
          if git diff --cached --quiet; then
            echo "無內容變更"
            exit 0
          fi
          git config user.name "daily-beast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Legacy Beast: manual update"
          git push
