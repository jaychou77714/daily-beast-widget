name: 爆肝獸每日內容更新
on:
  schedule:
    # 16:21 UTC = 台灣時間隔日 00:21；GitHub 排程可能延遲
    - cron: '21 16 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '指定日期 YYYY-MM-DD（留空為台灣今天）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-beast-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate today's content
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            node scripts/generate.mjs "--date=$TARGET_DATE"
          else
            node scripts/generate.mjs
          fi
      - name: Commit daily JSON if updated
        run: |
          if git diff --quiet -- data/today.json; then
            echo "無新內容需要上傳"
            exit 0
          fi
          git config user.name "daily-beast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/today.json
          git commit -m "Daily Beast: update content"
          git push
