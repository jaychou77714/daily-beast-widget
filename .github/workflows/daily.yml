name: 爆肝獸每日內容更新
on:
  schedule:
    # UTC 16:21 = 台灣隔日 00:21；GitHub 排程可能延遲
    - cron: '21 16 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '指定日期 YYYY-MM-DD（留空為台灣今天）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-beast-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate daily joke and raising event
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            node scripts/generate.mjs "--date=$TARGET_DATE"
            node scripts/generate-game.mjs "--date=$TARGET_DATE"
          else
            node scripts/generate.mjs
            node scripts/generate-game.mjs
          fi
      - name: Commit both daily files
        run: |
          git add data/today.json game/today.json
          if git diff --cached --quiet; then
            echo "今日內容無新變更"
            exit 0
          fi
          git config user.name "daily-beast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily Beast: joke and raising event"
          git push
